[package]
name = "codex-img"
version = "0.9.0"
edition = "2021"
description = "Generate and edit images with your ChatGPT/Codex subscription, calling the Codex image endpoint directly."
license = "Apache-2.0"
repository = "https://github.com/foksa/codex-img"
rust-version = "1.88"

[workspace]
members = ["crates/codex-img-core"]
default-members = [".", "crates/codex-img-core"]
resolver = "2"

[dependencies]
codex-img-core = { path = "crates/codex-img-core" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
fs2 = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

# Debug builds are for tests and quick runs. Line numbers in our own code, no debug info in
# dependencies and no incremental cache keep target/debug small (it grew past 4 GB).
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# exoquant with a deterministic histogram; see vendor/exoquant/VENDORED.md.
[patch.crates-io]
exoquant = { path = "vendor/exoquant" }
