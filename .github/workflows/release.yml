name: Release

# Push a tag like v0.2.0 to build and publish a release.
# Run manually (workflow_dispatch) to build all targets without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke-test the binary
        shell: bash
        run: tests/smoke.sh target/${{ matrix.target }}/release/codex-img${{ matrix.exe }}
      - name: Package
        shell: bash
        run: |
          name="codex-img-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || name="codex-img-dev-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/codex-img${{ matrix.exe }}" README.md LICENSE NOTICE "$name/"
          cp -R skills "$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            ls -l "$name/codex-img.exe" "$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            ls -l "$name/codex-img" "$name.tar.gz"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum *.tar.gz *.zip | tee SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes *.tar.gz *.zip SHA256SUMS
