name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release --locked
      - name: Smoke-test the binary
        shell: bash
        run: tests/smoke.sh target/release/codex-img

  # The oldest Rust that Cargo.toml's rust-version promises, with the locked dependencies.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked

  python-fallback:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is pinned to 24.04: actions/setup-python has no 3.9 build for ubuntu-latest (26.04).
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.x"
          - os: windows-latest
            python: "3.x"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/test_codex_img_py.py
