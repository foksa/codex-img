[package]
name = "codex-img-core"
version = "0.8.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Local image conversion shared by codex-img and other tools; no backend or auth."

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
exoquant = "0.2"
png = "0.18"
webp = { version = "0.3", default-features = false }
oxipng = { version = "10", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3"
